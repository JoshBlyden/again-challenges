<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Send Josh a Rejection</title>
  <meta name="description" content="Submit a rejection challenge for Josh to try on camera." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0E0E0E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Lato&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0E0E0E;
      --surface: #171717;
      --surface-2: #1F1F1F;
      --line: #2A2A2A;
      --text: #F2EEE9;
      --muted: #8F8A84;
      --placeholder: #5E5A56;
      --tt-red: #FE2B54;
      --tt-red-press: #E0204A;
      --tt-cyan: #22F5EE;
      --tt-teal: #1AB8B3;
      --live: #7FC784;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --display: "Lato", "Inter", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    body { min-height: 100dvh; display: flex; flex-direction: column; overflow-x: hidden; }
    main { width: 100%; max-width: 500px; margin: 0 auto; padding: 32px 16px 24px; flex: 1; }

    /* ── Title: TikTok-style stacked pills ── */
    .title {
      position: relative; width: 100%; max-width: 445px; aspect-ratio: 445 / 79.7; margin: 0 auto;
    }
    .title::before, .title::after {
      content: ""; position: absolute; width: 89.74%; height: 74%; border-radius: 999px;
    }
    .title::before { left: 0; top: 0; background: var(--tt-cyan); }
    .title::after  { left: 10.26%; top: 26%; background: var(--tt-red); }
    .title h1 {
      position: absolute; z-index: 1; left: 2.35%; top: 11.8%; width: 94.66%; height: 74%;
      display: flex; align-items: center; justify-content: center;
      background: #fff; border-radius: 999px; color: #424242;
      font: 400 clamp(24px, 7.4vw, 33px)/1.05 var(--display); letter-spacing: -.01em; white-space: nowrap;
    }
    .sub {
      margin-top: 26px; text-align: center; color: #fff;
      font-size: 15px; line-height: 1.5; font-style: italic;
    }

    /* ── Phones ── */
    .phones-wrap { --s: 1; height: calc(320px * var(--s)); margin-top: 32px; display: flex; justify-content: center; }
    .phones {
      position: relative; flex: none; width: 384px; height: 302px;
      transform: scale(var(--s)); transform-origin: top center;
      margin-inline: calc(384px * (var(--s) - 1) / 2); /* keep scaled layout width in bounds */
    }
    .phone {
      position: absolute; top: 0; width: 137px; height: 297px;
      border-radius: 24px; background: #000; border: 4.5px solid #262626;
      box-shadow: 0 18px 46px rgba(0,0,0,.6); overflow: hidden;
    }
    .phone::before { /* notch */
      content: ""; position: absolute; top: 5.5px; left: 50%; transform: translateX(-50%);
      width: 40px; height: 11px; background: #000; border-radius: 9px; z-index: 2;
    }
    .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .phone.left   { left: -14px; top: 25px; transform: rotate(-8deg); }
    .phone.right  { left: 261px; top: 25px; transform: rotate(8deg); }
    .phone.center { left: 123.5px; z-index: 2; border-color: #333; }

    .follow-float {
      position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px;
      background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(11.65px); backdrop-filter: blur(11.65px);
      border: 1px solid var(--tt-teal); border-radius: 999px;
      color: #000; font: 500 14px var(--sans); text-decoration: none; white-space: nowrap;
      transition: background .15s;
    }
    .follow-float:hover { background: rgba(255,255,255,.9); }

    @media (max-width: 470px) { .phones-wrap { --s: .86; } }
    @media (max-width: 400px) { .phones-wrap { --s: .8; } }
    @media (max-width: 360px) { .phones-wrap { --s: .72; } }

    /* ── Counter ── */
    .proof {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 14px; color: var(--muted); margin: 8px 0 12px; min-height: 20px;
      opacity: 0; transition: opacity .4s;
    }
    .proof.show { opacity: 1; }
    .proof .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 4px rgba(127,199,132,.18); }
    .proof strong { color: var(--text); font-weight: 600; }

    /* ── Form ── */
    form { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
    label.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    textarea {
      width: 100%; min-height: 130px; resize: vertical; border: 0; outline: none;
      background: transparent; color: var(--text); font: 17px/1.45 var(--sans); padding: 4px 4px 0;
    }
    textarea::placeholder { color: var(--placeholder); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
    .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .count.warn { color: var(--tt-red); }
    button {
      appearance: none; border: 0; cursor: pointer; border-radius: 999px;
      background: var(--tt-red); color: #fff; font: 600 15px var(--sans);
      padding: 13px 22px; min-height: 46px; transition: background .15s, opacity .15s, transform .1s;
    }
    button:active { transform: scale(.98); background: var(--tt-red-press); }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .hp { position: absolute; left: -9999px; } /* honeypot for bots */

    /* ── Thank-you state ── */
    .thanks { display: none; text-align: center; padding: 28px 12px; }
    .thanks h2 { font: 400 30px var(--display); margin-bottom: 8px; }
    .thanks p { color: var(--muted); font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
    .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .ghost:active { background: var(--surface-2); }
    .sent form { display: none; }
    .sent .thanks { display: block; }

    /* ── Toast ── */
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
      background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
      padding: 12px 18px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; max-width: calc(100% - 32px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ── Footer ── */
    footer { text-align: center; padding: 28px 16px calc(42px + env(safe-area-inset-bottom)); }
    footer a {
      color: var(--text); text-decoration: none; font: 500 14px var(--sans);
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px;
      border: 1px solid var(--line); border-radius: 999px; transition: border-color .15s;
    }
    footer a:hover { border-color: var(--tt-red); }
  </style>
</head>
<body>
  <main id="app">
    <div class="title"><h1>Send a rejection</h1></div>
    <p class="sub">Submit a challenge that'll probably get a “no.”</p>

    <div class="phones-wrap">
      <div class="phones">
        <div class="phone left"><img src="img/tiktok-1.jpg" alt="" /></div>
        <div class="phone right"><img src="img/tiktok-2.jpg" alt="" /></div>
        <div class="phone center"><img src="img/app-tracker.jpg" alt="" /></div>
        <a class="follow-float" href="https://www.tiktok.com/@joshuasblyden" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 1 1-2.59-2.59c.27 0 .53.04.77.12V9.79a5.7 5.7 0 1 0 4.91 5.64V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3a4.28 4.28 0 0 1-3.24-1.48z"/></svg>
          Follow on TikTok
        </a>
      </div>
    </div>

    <p class="proof" id="proof" aria-live="polite"><span class="dot"></span><span id="proofText"></span></p>

    <form id="form" novalidate>
      <label class="vh" for="idea">Your rejection challenge</label>
      <textarea id="idea" name="idea" maxlength="500"
        placeholder="Ask a stranger to trade sandwiches…"></textarea>
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <div class="row">
        <span class="count" id="count">0 / 500</span>
        <button type="submit" id="submit" disabled>Send it</button>
      </div>
    </form>

    <div class="thanks" role="status">
      <h2>Got it. Thank you.</h2>
      <p>If it scares me a little, it's probably going on camera.<br />Follow along to see if I do it.</p>
      <button class="ghost" id="again" type="button">Send another</button>
    </div>
  </main>

  <footer>
    <a href="https://www.tiktok.com/@joshuasblyden" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 1 1-2.59-2.59c.27 0 .53.04.77.12V9.79a5.7 5.7 0 1 0 4.91 5.64V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3a4.28 4.28 0 0 1-3.24-1.48z"/></svg>
      Follow on TikTok
    </a>
  </footer>

  <div class="toast" id="toast" role="alert"></div>

  <script type="module">
    // ─── Config ───────────────────────────────────────────────
    // The publishable key is safe to be public; the database rules
    // (schema.sql) only allow inserts.
    const SUPABASE_URL = "https://sysyugkfvujdphfqglzu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_P9wLLS7lQv2FzPes1GLIeQ_Fm2xO_2_";
    const MIN_COUNT_TO_SHOW = 5; // hide the counter until it's not embarrassing

    // ─── Backend (falls back to a local demo mode with no keys) ──
    const demo = !SUPABASE_URL || !SUPABASE_ANON_KEY;
    let sb = null;
    if (!demo) {
      const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const api = {
      async count() {
        if (demo) { try { return 37 + Number(localStorage.getItem("demoCount") || 0); } catch { return 37; } }
        const { data, error } = await sb.rpc("get_submission_count");
        if (error) throw error;
        return Number(data);
      },
      async submit(idea) {
        if (demo) {
          await new Promise(r => setTimeout(r, 500));
          try { localStorage.setItem("demoCount", String(Number(localStorage.getItem("demoCount") || 0) + 1)); } catch {}
          return;
        }
        const { error } = await sb.from("challenge_ideas").insert({
          idea,
          referrer: document.referrer || null,
          user_agent: navigator.userAgent.slice(0, 300),
        });
        if (error) throw error;
      },
    };

    // ─── UI ───────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const app = $("app"), form = $("form"), idea = $("idea"), btn = $("submit"),
          countEl = $("count"), proof = $("proof"), proofText = $("proofText"), toast = $("toast");

    function toastMsg(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastMsg.t);
      toastMsg.t = setTimeout(() => toast.classList.remove("show"), 2800);
    }

    async function refreshCount() {
      try {
        const n = await api.count();
        if (Number.isFinite(n) && n >= MIN_COUNT_TO_SHOW) {
          proofText.innerHTML = `<strong>${n.toLocaleString()}</strong> people have sent Josh a rejection`;
          proof.classList.add("show");
        } else {
          proof.classList.remove("show");
        }
      } catch { proof.classList.remove("show"); }
    }

    idea.addEventListener("input", () => {
      const len = idea.value.length;
      countEl.textContent = `${len} / 500`;
      countEl.classList.toggle("warn", len > 450);
      btn.disabled = idea.value.trim().length < 3;
    });

    form.addEventListener("submit", async e => {
      e.preventDefault();
      if (form.website.value) return; // bot filled the honeypot
      const text = idea.value.trim();
      if (text.length < 3) return;
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        await api.submit(text);
        idea.value = ""; countEl.textContent = "0 / 500";
        app.classList.add("sent");
        refreshCount();
      } catch (err) {
        console.error(err);
        toastMsg("That didn't go through. Try again?");
        btn.disabled = false;
      } finally {
        btn.textContent = "Send it";
      }
    });

    $("again").addEventListener("click", () => {
      app.classList.remove("sent");
      btn.disabled = true;
      idea.focus();
    });

    refreshCount();
  </script>
</body>
</html>
